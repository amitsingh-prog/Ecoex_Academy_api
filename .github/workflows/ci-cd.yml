name: ASP.NET Core CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  # ==================================================
  # JOB 1
  # BUILD → PUBLISH → UPLOAD ARTIFACT
  # ==================================================

  build:

    name: Build & Publish

    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    outputs:
      artifact_id: ${{ steps.upload_artifact.outputs.artifact-id }}

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. SETUP .NET 8
      # ==================================================

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'


      # ==================================================
      # 3. VERIFY .NET
      # ==================================================

      - name: Check .NET Version
        run: |
          echo "Installed .NET version:"
          dotnet --version

          echo ""
          echo "Installed .NET SDKs:"
          dotnet --list-sdks


      # ==================================================
      # 4. RESTORE
      # ==================================================

      - name: Restore NuGet Packages
        run: |
          dotnet restore


      # ==================================================
      # 5. BUILD
      # ==================================================

      - name: Build Application
        run: |
          dotnet build \
            --configuration Release \
            --no-restore


      # ==================================================
      # 6. PUBLISH
      # ==================================================

      - name: Publish Application
        run: |
          dotnet publish \
            --configuration Release \
            --no-build \
            --output ./publish


      # ==================================================
      # 7. VERIFY PUBLISH
      # ==================================================

      - name: Verify Publish Output
        run: |
          echo "Published files:"
          find ./publish -type f

          echo ""
          echo "Publish directory size:"
          du -sh ./publish


      # ==================================================
      # 8. UPLOAD ARTIFACT
      #
      # This artifact will be used by Job 2.
      # ==================================================

      - name: Upload Publish Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecoex-academy-api-${{ github.run_id }}
          path: ./publish
          if-no-files-found: error
          retention-days: 1


  # ==================================================
  # JOB 2
  # DOWNLOAD ARTIFACT → DEPLOY TO VPS
  # ==================================================

  deploy:

    name: Deploy To VPS

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ==================================================
      # 1. DOWNLOAD ARTIFACT
      # ==================================================

      - name: Download Publish Artifact
        uses: actions/download-artifact@v4
        with:
          name: ecoex-academy-api-${{ github.run_id }}
          path: ./publish


      # ==================================================
      # 2. VERIFY DOWNLOADED FILES
      # ==================================================

      - name: Verify Downloaded Files
        run: |
          echo "Files downloaded from artifact:"
          find ./publish -type f

          echo ""
          echo "Publish directory size:"
          du -sh ./publish


      # ==================================================
      # 3. DEPLOY ATTEMPT 1
      # ==================================================

      - name: Deploy To VPS - Attempt 1
        id: deploy1
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

          source: "./publish/*"

          target: "/root/Ecoex/Projects/Ecoex_Academy_AdminPanel/Api/Publish"

          overwrite: true
          strip_components: 1


      # ==================================================
      # 4. DEPLOY ATTEMPT 2
      # ==================================================

      - name: Deploy To VPS - Attempt 2
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

          source: "./publish/*"

          target: "/root/Ecoex/Projects/Ecoex_Academy_AdminPanel/Api/Publish"

          overwrite: true
          strip_components: 1


      # ==================================================
      # 5. DEPLOY ATTEMPT 3
      # ==================================================

      - name: Deploy To VPS - Attempt 3
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

          source: "./publish/*"

          target: "/root/Ecoex/Projects/Ecoex_Academy_AdminPanel/Api/Publish"

          overwrite: true
          strip_components: 1


      # ==================================================
      # 6. VERIFY DEPLOYMENT
      # ==================================================

      - name: Verify Deployment
        run: |

          if [ "${{ steps.deploy1.outcome }}" = "success" ] || \
             [ "${{ steps.deploy2.outcome }}" = "success" ] || \
             [ "${{ steps.deploy3.outcome }}" = "success" ]; then

            echo "=========================================="
            echo "Deployment to VPS succeeded."
            echo "=========================================="

          else

            echo "=========================================="
            echo "Deployment failed after 3 attempts."
            echo "=========================================="

            exit 1

          fi


  # ==================================================
  # JOB 3
  # RESTART SERVICE
  # ==================================================

  restart:

    name: Restart API Service

    needs: deploy

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # RESTART ATTEMPT 1
      # ==================================================

      - name: Restart Service - Attempt 1
        id: restart1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

          script: |

            echo "Restarting Ecoex Academy API..."

            systemctl restart ecoeex-academy-api

            sleep 3

            systemctl is-active --quiet ecoeex-academy-api

            echo "Service restarted successfully."


      # ==================================================
      # RESTART ATTEMPT 2
      # ==================================================

      - name: Restart Service - Attempt 2
        id: restart2
        if: steps.restart1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

          script: |

            echo "Restart attempt 2..."

            systemctl restart ecoeex-academy-api

            sleep 3

            systemctl is-active --quiet ecoeex-academy-api

            echo "Service restarted successfully."


      # ==================================================
      # RESTART ATTEMPT 3
      # ==================================================

      - name: Restart Service - Attempt 3
        id: restart3
        if: steps.restart1.outcome == 'failure' && steps.restart2.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

          script: |

            echo "Restart attempt 3..."

            systemctl restart ecoeex-academy-api

            sleep 3

            systemctl is-active --quiet ecoeex-academy-api

            systemctl status ecoeex-academy-api --no-pager

            echo "Service restarted successfully."


      # ==================================================
      # VERIFY RESTART
      # ==================================================

      - name: Verify Service Restart
        run: |

          if [ "${{ steps.restart1.outcome }}" = "success" ] || \
             [ "${{ steps.restart2.outcome }}" = "success" ] || \
             [ "${{ steps.restart3.outcome }}" = "success" ]; then

            echo "=========================================="
            echo "Service restart successful."
            echo "=========================================="

          else

            echo "=========================================="
            echo "Service restart failed after 3 attempts."
            echo "=========================================="

            exit 1

          fi


  # ==================================================
  # JOB 4
  # FINAL VERIFICATION
  # ==================================================

  verify:

    name: Final Deployment Verification

    needs:
      - deploy
      - restart

    runs-on: ubuntu-latest

    if: always()

    steps:

      # ==================================================
      # CHECK ALL PREVIOUS JOBS
      # ==================================================

      - name: Check Deployment Status
        run: |

          echo "=========================================="
          echo "FINAL DEPLOYMENT STATUS"
          echo "=========================================="

          echo "Build job    : ${{ needs.build.result }}"
          echo "Deploy job   : ${{ needs.deploy.result }}"
          echo "Restart job  : ${{ needs.restart.result }}"

          echo "=========================================="


          if [ "${{ needs.deploy.result }}" != "success" ]; then

            echo "Deployment failed."
            exit 1

          fi


          if [ "${{ needs.restart.result }}" != "success" ]; then

            echo "Service restart failed."
            exit 1

          fi


          echo "=========================================="
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=========================================="


  # ==================================================
  # JOB 5
  # CLEANUP ARTIFACT
  #
  # IMPORTANT:
  # always() means this job runs even when
  # Build / Deploy / Restart / Verify fails.
  # ==================================================

  cleanup:

    name: Cleanup Artifact

    needs:
      - build
      - deploy
      - restart
      - verify

    runs-on: ubuntu-latest

    if: always()

    permissions:
      actions: write

    steps:

      # ==================================================
      # DELETE ARTIFACT
      # ==================================================

      - name: Delete Current Run Artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}

        run: |

          echo "=========================================="
          echo "CLEANING UP ARTIFACT"
          echo "=========================================="


          if [ -n "$ARTIFACT_ID" ]; then

            echo "Artifact ID: $ARTIFACT_ID"

            gh api \
              --method DELETE \
              "/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID"

            echo "Artifact deleted successfully."

          else

            echo "No artifact found to delete."

          fi


          echo "=========================================="
          echo "CLEANUP COMPLETED"
          echo "=========================================="
